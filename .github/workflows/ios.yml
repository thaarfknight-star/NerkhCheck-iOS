name: iOS Build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app/Contents/Developer

      - name: Build (iPhone Simulator)
        run: |
          xcodebuild -project NerkhCheck/NerkhCheck.xcodeproj \
            -scheme NerkhCheck \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build \
            build

      - name: Upload .app
        uses: actions/upload-artifact@v4
        with:
          name: NerkhCheck-app
          path: build/Build/Products/Debug-iphonesimulator/NerkhCheck.app
